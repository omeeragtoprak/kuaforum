name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NOT: ubuntu-latest runner'da Docker host-level kuruludur — Testcontainers
    # default `/var/run/docker.sock` üzerinden container başlatır. Eski
    # `services.docker: docker:dind` tanımı, Testcontainers'ı DinD namespace'ine
    # yönlendirip Postgres connection refused (127.0.0.1:5432) yapıyordu.
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        working-directory: backend
        # NOT: `dotnet restore`/`build` ÇIPLAK çağrılamaz — solution dosyası `.slnx`
        # formatında ve kurulu .NET 8 SDK'sı onu tanımıyor ("Specify a project or
        # solution file" ile düşer). Yerelde de bu yüzden proje bazlı çalışıyoruz.
        # Api projesi tüm katmanları referansladığı için restore/build ondan yapılıyor;
        # test projeleri ayrıca restore ediliyor.
        run: |
          dotnet restore src/Kuaforum.Api/Kuaforum.Api.csproj
          dotnet restore tests/Kuaforum.Tests.Domain/Kuaforum.Tests.Domain.csproj
          dotnet restore tests/Kuaforum.Tests.Application/Kuaforum.Tests.Application.csproj
          dotnet restore tests/Kuaforum.Tests.Integration/Kuaforum.Tests.Integration.csproj

      - name: Build
        working-directory: backend
        run: |
          dotnet build src/Kuaforum.Api/Kuaforum.Api.csproj --no-restore --configuration Release
          dotnet build tests/Kuaforum.Tests.Domain/Kuaforum.Tests.Domain.csproj --no-restore --configuration Release
          dotnet build tests/Kuaforum.Tests.Application/Kuaforum.Tests.Application.csproj --no-restore --configuration Release
          dotnet build tests/Kuaforum.Tests.Integration/Kuaforum.Tests.Integration.csproj --no-restore --configuration Release

      - name: Domain unit tests
        working-directory: backend
        run: dotnet test tests/Kuaforum.Tests.Domain --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"

      - name: Application unit tests
        working-directory: backend
        # Kuaforum.Tests.Application yalnız FluentValidation validator testleri içerir
        # (tek ProjectReference: Kuaforum.Application — DB/Redis/Testcontainers/WebApplicationFactory
        # yok, bkz. Validators/*.cs). Domain testleriyle aynı şekilde servis-siz koşar.
        run: dotnet test tests/Kuaforum.Tests.Application --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"

      - name: Integration tests (Testcontainers)
        working-directory: backend
        run: dotnet test tests/Kuaforum.Tests.Integration --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"

      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "## Backend Code Coverage (baseline ölçüm — gate yok)"
            echo ""
            echo "| Proje | Line Coverage |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for proj in Kuaforum.Tests.Domain Kuaforum.Tests.Application Kuaforum.Tests.Integration; do
            file=$(find "tests/$proj" -name "coverage.cobertura.xml" 2>/dev/null | head -n1)
            if [ -n "$file" ]; then
              rate=$(grep -o 'line-rate="[0-9.]*"' "$file" | head -n1 | grep -o '[0-9.]*')
              pct=$(awk "BEGIN { printf \"%.1f\", ${rate:-0} * 100 }")
              echo "| $proj | ${pct}% |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $proj | _rapor bulunamadı_ |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  mobile:
    name: Mobile (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: mobile
        run: pnpm typecheck

      - name: Test (Jest)
        working-directory: mobile
        run: pnpm test --ci

  web-admin:
    name: Web admin (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        working-directory: web-admin
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web-admin
        run: pnpm typecheck

      - name: Next.js build
        working-directory: web-admin
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:5100'
        run: pnpm build
